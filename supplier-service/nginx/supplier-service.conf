# Конфиг Nginx для сервиса поставщиков.
# На сервере заменяет содержимое /etc/nginx/sites-enabled/default
# (тот файл, который автоматически подправил certbot при выпуске сертификата).
#
# Домен уже указан в punycode-форме (прайс-поставщики.рф).

server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbbi4aacm6agdipdp8i.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn----7sbbi4aacm6agdipdp8i.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn----7sbbi4aacm6agdipdp8i.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----7sbbi4aacm6agdipdp8i.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
